setup_commands:
  - "python -m pip install -r requirements.txt"
run_commands:
  - "python src/demo.py"
  - "python -m src.main index --input demo_videos --index index --interval 1 --batch-size 8 --output index_report.json"
  - "python -m src.main search --index index --query 'a red round object' --top-k 5 --output results.json"
test_commands:
  - "python -m pytest -q"
notes: "First run downloads CLIP ViT-B/32 model/processor (~600 MB); internet required. CPU supported (slow); CUDA optional. Demo videos are synthetic smoke tests, not retrieval benchmarks."
